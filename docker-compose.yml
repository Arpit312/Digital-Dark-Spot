# ==============================================================================
#  DarkSpot Atlas - Full Production Docker Compose Stack
#  Orchestrates: FastAPI Backend + Next.js Web + Next.js Admin Console
# ==============================================================================

version: "3.9"

services:
  # ============================================================================
  # 1. FastAPI Multi-Agent Backend API Server (Port 8000)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: darkspot-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - darkspot-net
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
        reservations:
          memory: 256M
          cpus: "0.25"

  # ============================================================================
  # 2. Next.js Web Frontend (Port 3000)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: darkspot-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - darkspot-net

  # ============================================================================
  # 3. Next.js Admin Management Console (Port 3001)
  # ============================================================================
  admin:
    build:
      context: ./darkspot-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: darkspot-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - darkspot-net

volumes:
  backend-logs:
    driver: local

networks:
  darkspot-net:
    driver: bridge
    name: darkspot-network
